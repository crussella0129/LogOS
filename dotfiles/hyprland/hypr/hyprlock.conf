# Hyprlock — LogOS lock screen
# Theme: @@THEME_NAME@@

general {
    hide_cursor = true
    grace = 5
}

background {
    monitor =
    color = rgb(@@THEME_BG@@)
    blur_passes = 3
    blur_size = 5
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(@@THEME_BORDER@@)
    inner_color = rgb(@@THEME_BG_ALT@@)
    font_color = rgb(@@THEME_FG@@)
    fade_on_empty = true
    placeholder_text = <i>Enter passphrase...</i>
    check_color = rgb(@@THEME_ACCENT@@)
    fail_color = rgb(@@THEME_RED@@)
    fail_text = <i>Authentication failed</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(@@THEME_ACCENT@@)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = LogOS
    color = rgb(@@THEME_FG_DIM@@)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, -80
    halign = center
    valign = center
}
