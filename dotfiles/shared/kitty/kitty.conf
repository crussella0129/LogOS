# Kitty — LogOS terminal
# Theme: @@THEME_NAME@@

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

cursor_shape     beam
cursor_blink_interval 0.5
scrollback_lines 10000

window_padding_width 6
confirm_os_window_close 0

# Colors
foreground            @@THEME_FG@@
background            @@THEME_BG@@
selection_foreground  @@THEME_BG@@
selection_background  @@THEME_ACCENT@@
cursor                @@THEME_ACCENT@@
cursor_text_color     @@THEME_BG@@
url_color             @@THEME_BLUE@@

# ANSI colors (normal)
color0  @@THEME_ANSI_BLACK@@
color1  @@THEME_ANSI_RED@@
color2  @@THEME_ANSI_GREEN@@
color3  @@THEME_ANSI_YELLOW@@
color4  @@THEME_ANSI_BLUE@@
color5  @@THEME_ANSI_MAGENTA@@
color6  @@THEME_ANSI_CYAN@@
color7  @@THEME_ANSI_WHITE@@

# ANSI colors (bright)
color8  @@THEME_ANSI_BRIGHT_BLACK@@
color9  @@THEME_ANSI_BRIGHT_RED@@
color10 @@THEME_ANSI_BRIGHT_GREEN@@
color11 @@THEME_ANSI_BRIGHT_YELLOW@@
color12 @@THEME_ANSI_BRIGHT_BLUE@@
color13 @@THEME_ANSI_BRIGHT_MAGENTA@@
color14 @@THEME_ANSI_BRIGHT_CYAN@@
color15 @@THEME_ANSI_BRIGHT_WHITE@@

# Tab bar
active_tab_foreground   @@THEME_BG@@
active_tab_background   @@THEME_ACCENT@@
inactive_tab_foreground @@THEME_FG_DIM@@
inactive_tab_background @@THEME_BG_ALT@@
tab_bar_style           powerline
