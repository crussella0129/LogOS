# /etc/portage/make.conf — LogOS Gentoo (Phase A: bootable VM)
# Minimal config for building a bootable system in chroot.

# Compiler flags — conservative for chroot build (not native target)
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Parallelism — filled in by build script
MAKEOPTS="-j@NPROC@"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=@NPROC@.0 --changed-use --with-bdeps=y"

# USE flags — minimal for bootable VM (OpenRC, no systemd)
USE="cryptsetup btrfs dist-kernel -handbook -systemd"

# GRUB
GRUB_PLATFORMS="efi-64"

# Accept licenses for firmware
ACCEPT_LICENSE="*"

# Locale
LC_MESSAGES=C.utf8
L10N="en"
