# LogOS Gentoo — /etc/dracut.conf.d/logos.conf
# Dracut configuration for LUKS2 + Btrfs + systemd boot

# Required modules for encrypted Btrfs root
add_dracutmodules+=" crypt dm rootfs-block btrfs "

# systemd in initramfs — native LUKS unlock via systemd-cryptsetup
add_dracutmodules+=" systemd systemd-initrd systemd-cryptsetup "

# Early microcode loading
early_microcode="yes"

# Compression — zstd for speed/ratio balance
compress="zstd"
compress_options="-9 -T0"

# Include crypttab for systemd-cryptsetup LUKS unlock
install_items+=" /etc/crypttab "

# Kernel modules to force-include
add_drivers+=" btrfs dm-crypt aes-x86_64 "

# Hostonly — build for this specific hardware
hostonly="yes"
# Embed rd.luks.uuid in initramfs as safety net
hostonly_cmdline="yes"
